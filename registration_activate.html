<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aviation Matrix Activation</title><style>
:root{--navy:#0b2f4e;--blue:#177ca7;--ink:#29475a;--muted:#748895;--line:#dbeaf1;--bg:#f7fbfd;--good:#1f7a50;--warn:#9b6a16;--bad:#a8443e;--shadow:0 16px 40px rgba(34,76,101,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 8% 0,#e8f9ff,transparent 24%),radial-gradient(circle at 90% 0,#eeeaff,transparent 28%),var(--bg);color:var(--ink)}
a{text-decoration:none;color:inherit}.wrap{max-width:1450px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{font-size:18px;font-weight:1000;color:var(--navy)}.brand small{display:block;font-size:8px;letter-spacing:.14em;color:#7e929f}.nav{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:9px 12px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:9px;font-weight:1000;color:var(--blue)}
.hero{padding:28px 30px;border-radius:28px;background:linear-gradient(135deg,#0b3152,#197ca6 58%,#7169d7);color:#fff;box-shadow:var(--shadow)}.hero h1{font-size:35px;margin:0 0 7px;letter-spacing:-.04em}.hero p{margin:0;max-width:1050px;font-size:11px;line-height:1.6;color:#dff2fa}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.kpi small{font-size:8px;font-weight:1000;color:var(--muted)}.kpi strong{display:block;font-size:23px;color:var(--navy);margin-top:4px}.btn{border:0;border-radius:11px;padding:10px 12px;font-weight:1000;cursor:pointer}.primary{background:var(--navy);color:#fff}.soft{background:#eaf6fb;color:#0b5c82}.danger{background:#fff0ef;color:var(--bad)}
.field label{display:block;font-size:7px;font-weight:1000;color:#607987;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;font:inherit}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.sub{font-size:9px;color:var(--muted);line-height:1.5}.status{display:inline-flex;padding:5px 7px;border-radius:999px;background:#eef4f7;font-size:7px;font-weight:1000;color:#5f7684}.status.good{background:#e8f7ef;color:var(--good)}.status.warn{background:#fff5dc;color:var(--warn)}
.table{width:100%;border-collapse:collapse;font-size:9px}.table th,.table td{padding:9px 7px;border-bottom:1px solid #edf2f5;text-align:left;vertical-align:top}.table th{font-size:7px;text-transform:uppercase;color:var(--muted)}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tab{padding:8px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:8px;font-weight:1000;cursor:pointer}.tab.active{background:var(--navy);color:#fff}.panel{display:none}.panel.active{display:block}.notice{margin-top:12px;padding:10px;border-radius:12px;background:#edf8fc;color:#0b5c82;font-size:8.5px;line-height:1.5}.err{color:var(--bad);font-size:9px;margin-top:8px}.ok{color:var(--good);font-size:9px;margin-top:8px}.modal{position:fixed;inset:0;background:#0a2238aa;display:none;place-items:center;padding:18px;z-index:9999}.modal.open{display:grid}.modal-card{width:min(760px,100%);background:#fff;border-radius:22px;padding:20px;max-height:90vh;overflow:auto}
@media(max-width:900px){.grid,.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="top"><a class="pill" href="registration_request.html">← Registration Request</a><div class="brand">AVIATION MATRIX<small>ACTIVATION GATE</small></div></div><section class="hero"><h1>Activate Your Registration</h1><p>Individual applicants use their Application Number + Personal Code. Institution trainees use Application Number + Group/Batch Code + Personal Code.</p></section><section class="card" style="max-width:760px;margin:16px auto"><div class="form"><div class="field full"><label>APPLICATION NUMBER</label><input id="app" placeholder="AM-A-0000001"></div><div class="field"><label>GROUP / BATCH CODE (institution only)</label><input id="batch" placeholder="GRP-XXXXXX"></div><div class="field"><label>PERSONAL ACTIVATION CODE</label><input id="code" placeholder="XXXXXX"></div></div><button class="btn primary" style="margin-top:12px" onclick="activate()">Start My Journey</button><div id="msg"></div></section></div><script>
const API='https://vsuekfzyebqnhthyvwpf.supabase.co/functions/v1/registration-public-api';
async function activate(){msg.textContent='Checking…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify_code',application_number:app.value,batch_code:batch.value,code:code.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||d.detail);localStorage.setItem('am_registration_token',d.registration_token);location.href='registration_onboarding.html'}catch(e){msg.className='err';msg.textContent=e.message}}
</script></body></html>
