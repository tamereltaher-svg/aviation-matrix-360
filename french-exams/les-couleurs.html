<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102947">
<title>Examen de Français — Les Couleurs</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#152944;background:#f3f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,500px);background:#fff;border:1px solid #dde7f1;border-radius:22px;padding:clamp(20px,5vw,32px);box-shadow:0 15px 45px #10294712}.eyebrow{color:#5f7896;letter-spacing:.12em;font-weight:800;font-size:11px;text-transform:uppercase}.muted{color:#677b95}h1{font-size:clamp(27px,6vw,33px);line-height:1.16;margin:8px 0 12px}h2{font-size:23px;margin:14px 0}label{display:block;margin:22px 0 7px;font-weight:700;font-size:14px}input{width:100%;padding:15px 16px;border:1.5px solid #b6c6d7;border-radius:12px;font-size:17px;outline-offset:3px}input:focus{border-color:#1a70c9}button{width:100%;border:0;border-radius:12px;padding:16px 20px;margin-top:17px;background:#12385c;color:#fff;font-size:16px;font-weight:750;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:3px solid #3b82f6;outline-offset:3px}.secondary{background:#eef3f9;color:#17416a}.wa{background:#128c48}.progress{width:100%;height:7px;background:#e9eff6;border-radius:20px;overflow:hidden;margin:14px 0}.bar{height:100%;background:#3579bc;transition:width .2s}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;color:#677b95}.swatch{width:min(100%,245px);height:164px;border-radius:20px;margin:29px auto;box-shadow:0 9px 20px #173a5a18;border:1px solid #dae2eb}.center{text-align:center}.score{font-size:58px;font-weight:900;letter-spacing:-.06em;margin:14px 0;color:#134972}.score small{font-size:19px;letter-spacing:normal}.info{padding:13px;border-radius:12px;background:#f0f6fb;margin:16px 0;text-align:left;line-height:1.8;overflow-wrap:anywhere}.micro{font-size:12px;color:#708198;line-height:1.6;margin-top:20px}#notice{font-size:14px;color:#137840;min-height:20px}.hidden{display:none!important}
</style>
</head>
<body><main>
<div class="eyebrow">Examen de Français</div>
<section id="start">
<h1>Les Couleurs</h1><p class="muted">Regarde chaque couleur et écris son nom en français. Dix questions, une seule tentative sur cet appareil.</p>
<label for="name">Prénom et nom</label><input id="name" placeholder="Ton nom" autocomplete="name" maxlength="100">
<button id="startBtn">Commencer l'examen</button>
</section>
<section id="exam" class="hidden">
<div class="topline"><strong>Les Couleurs</strong><span id="count"></span></div><div class="progress"><div class="bar" id="bar"></div></div>
<h2 class="center">Quelle est cette couleur ?</h2><div id="swatch" class="swatch" role="img" aria-label="Échantillon de couleur à identifier"></div>
<label for="answer">Écris la couleur :</label><input id="answer" placeholder="Ta réponse..." spellcheck="false" autocapitalize="none" autocomplete="off" maxlength="60" enterkeyhint="next">
<button id="nextBtn">Suivant</button>
</section>
<section id="result" class="hidden">
<div class="center"><h1>Examen terminé !</h1><p class="muted" id="student"></p><div class="score" id="score"></div><p id="congrats" class="muted"></p></div>
<div class="info" id="summary"></div>
<button class="wa" id="shareBtn">Envoyer mon résultat sur WhatsApp</button>
<button class="secondary" id="copyBtn">Copier le résultat</button><p id="notice" role="status"></p>
<p class="micro">La note est calculée sur cet appareil. Elle n'est pas vérifiée par un serveur.</p>
</section>
</main>
<script>
(()=>{'use strict';
const COLORS=[{name:'Rouge',hex:'#e53935'},{name:'Bleu',hex:'#1976d2'},{name:'Vert',hex:'#43a047'},{name:'Jaune',hex:'#fdd835'},{name:'Noir',hex:'#151515'},{name:'Blanc',hex:'#ffffff'},{name:'Rose',hex:'#f48fb1'},{name:'Orange',hex:'#fb8c00'},{name:'Violet',hex:'#8e44ad'},{name:'Marron',hex:'#795548'}];
const KEY='les_couleurs_fr_exam_20261111';let state=null;
const $=id=>document.getElementById(id);
function normal(s){return String(s||'').trim().normalize('NFC').toLocaleLowerCase('fr-FR').replace(/\s+/g,' ');}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function show(id){for(const x of ['start','exam','result'])$(x).classList.toggle('hidden',x!==id);}
function shuffle(){const a=COLORS.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function draw(){if(state.completed){renderResult();return;}show('exam');$('count').textContent='Question '+(state.index+1)+' / 10';$('bar').style.width=(state.index/10*100)+'%';$('swatch').style.backgroundColor=COLORS[state.order[state.index]].hex;$('answer').value=state.draft||'';$('nextBtn').textContent=state.index===9?'Terminer':'Suivant';}
function message(){let p=Math.round(state.score*10);return 'Résultat — Les Couleurs\nÉlève : '+state.name+'\nNote : '+state.score+'/10 ('+p+' %)\nExamen : Français — Les Couleurs';}
function renderResult(){show('result');$('student').textContent=state.name;$('score').textContent=state.score+' / 10';$('congrats').textContent=state.score*10+' %';$('summary').textContent='Examen : Français — Les Couleurs\nÉlève : '+state.name+'\nQuestions : 10\nNote : '+state.score+'/10\nTerminé le : '+new Date(state.completedAt).toLocaleString('fr-FR');$('summary').style.whiteSpace='pre-line';}
$('startBtn').addEventListener('click',()=>{const name=$('name').value.trim();if(!name){$('name').focus();return;}state={name,order:shuffle(),index:0,answers:[],draft:'',completed:false};save();draw();});
$('answer').addEventListener('input',e=>{if(!state||state.completed)return;state.draft=e.target.value;save();});
$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){$('nextBtn').click();}});
$('name').addEventListener('keydown',e=>{if(e.key==='Enter'){$('startBtn').click();}});
$('nextBtn').addEventListener('click',()=>{if(!state||state.completed)return;const ans=$('answer').value.trim();if(!ans){$('answer').focus();return;}state.answers.push(ans);state.index++;state.draft='';if(state.index===10){state.score=state.answers.reduce((n,a,i)=>n+(normal(a)===normal(COLORS[state.order[i]].name)?1:0),0);state.completed=true;state.completedAt=new Date().toISOString();save();renderResult();}else{save();draw();}});
$('shareBtn').addEventListener('click',()=>{if(!state?.completed)return;window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(message()),'_blank','noopener,noreferrer');});
$('copyBtn').addEventListener('click',async()=>{if(!state?.completed)return;try{await navigator.clipboard.writeText(message());$('notice').textContent='Résultat copié !';}catch(e){const t=document.createElement('textarea');t.value=message();document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();$('notice').textContent='Résultat copié !';}});
try{const raw=localStorage.getItem(KEY);if(raw){const saved=JSON.parse(raw);if(saved&&typeof saved.name==='string'&&Array.isArray(saved.order)&&saved.order.length===10&&Array.isArray(saved.answers)){state=saved;state.completed?renderResult():draw();}}}catch(e){}
})();
</script></body></html>
