<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#15395d"><title>Examen Général — Français</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#173754;background:#f3f7fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}main{width:min(100%,540px);padding:clamp(20px,5vw,34px);background:white;border:1px solid #deebf5;border-radius:20px;box-shadow:0 14px 42px #133d6514}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:#607f99}h1{font-size:29px;margin:8px 0}h2{font-size:21px}p{line-height:1.5}.muted{color:#6c8297}.back{border:0;background:none;color:#1c6194;font-weight:750;padding:8px 0 18px;font-size:14px;cursor:pointer}button,input{font-family:inherit}.btn{width:100%;padding:15px 18px;margin-top:15px;border-radius:12px;font-size:16px;font-weight:800;border:0;background:#153f65;color:white;cursor:pointer}.btn:disabled{opacity:.43;cursor:not-allowed}.wa{background:#148848}.light{background:#e9f1f8;color:#16466f}.hidden{display:none!important}.progress{background:#e5eef6;height:7px;border-radius:20px;overflow:hidden;margin:14px 0 18px}.bar{background:#2b77b6;height:100%}.between{display:flex;justify-content:space-between;gap:12px;align-items:center}.small{font-size:13px;color:#5e7b96}.center{text-align:center}.swatch{height:140px;width:min(100%,235px);margin:23px auto;border-radius:18px;border:1px solid #d8e4ee;box-shadow:0 6px 18px #103c6018}.display{display:grid;place-items:center;background:#f1f8ff;color:#17578f;font-size:92px;font-weight:850;width:min(100%,235px);height:140px;margin:23px auto;border:1px solid #dce8f3;border-radius:18px}.display svg{width:175px;height:125px}.emoji{font-size:87px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.choice{border:2px solid #dce6ef;background:#f7faff;color:#173e5d;border-radius:13px;min-height:62px;padding:12px 6px;font-size:17px;font-weight:750;cursor:pointer}.choice[aria-pressed="true"]{background:#e0efff;border-color:#1d65a0}label{display:block;font-weight:800;font-size:15px;margin:14px 0 7px}input{width:100%;border:1.5px solid #bacddd;border-radius:12px;font-size:19px;padding:15px;outline-offset:3px}.blank{font-size:38px;font-weight:850;text-align:center;letter-spacing:.12em;margin:17px 0 5px}.score{font-size:57px;font-weight:950;color:#125383;margin:12px 0}.attempt{background:#f1f7fc;border:1px solid #d8e7f3;border-radius:14px;padding:16px;text-align:center;margin:18px 0}.dots{display:flex;justify-content:center;gap:10px;margin:10px 0}.dot{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid #bad0e0;background:white;font-size:14px;font-weight:850;color:#52718c}.dot.used{background:#185c9b;color:white;border-color:#185c9b}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid #e1eaf3;font-size:14px}.row strong{color:#164f84}.micro{font-size:12px;line-height:1.65;color:#7890a6;margin-top:18px}.status{font-size:14px;color:#13733d}
</style></head><body><main><div class="eyebrow">Exercices de Français</div>
<section id="exam">
<button id="backExam" class="back">← Tous les thèmes</button>
<div class="between"><strong>Examen Général</strong><span class="small" id="counter"></span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<p class="small center" id="topic"></p><p class="small center" id="mode"></p>
<h2 class="center" id="prompt"></h2>
<div id="swatch" class="swatch hidden"></div><div id="numeric" class="display hidden"></div><div id="alpha" class="display hidden"></div><div id="shape" class="display hidden"></div><div id="emoji" class="display emoji hidden"></div>
<div id="options" class="choices hidden"></div>
<div id="writeGroup" class="hidden"><label id="writeLabel" for="writeInput">Écris le mot :</label><input id="writeInput" maxlength="30" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Ta réponse..."></div>
<div id="letterGroup" class="hidden"><div id="blank" class="blank"></div><label for="letterInput">Quelle lettre manque ?</label><input id="letterInput" maxlength="1" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Une lettre..."></div>
<button id="next" class="btn" disabled>Suivant</button>
</section>
<section id="result" class="hidden">
<button id="backResult" class="back">← Tous les thèmes</button>
<h1 class="center">Examen Général</h1><p class="muted center">Résultats des 6 thèmes</p>
<div id="score" class="score center"></div><p id="percentage" class="muted center"></p>
<div class="attempt"><strong id="attempt"></strong><div class="dots" id="dots"></div><div id="remaining"></div><div id="history" class="small"></div></div>
<h2>Résultat par thème</h2><div id="breakdown"></div>
<label for="name">Prénom et nom</label><input id="name" maxlength="100" autocomplete="name" placeholder="Ton nom">
<button id="retry" class="btn">Recommencer l'examen</button>
<button id="share" class="btn wa" disabled>Envoyer toutes mes notes sur WhatsApp</button>
<button id="copy" class="btn light" disabled>Copier toutes mes notes</button>
<p id="status" class="status" role="status"></p><p class="micro">3 tentatives maximum enregistrées sur cet appareil. Résultats non certifiés par un serveur.</p>
</section></main>
<script>
(()=>{'use strict';
const BANK={
colors:[['Rouge','#e53935',1],['Bleu','#1976d2',2],['Vert','#43a047',2],['Jaune','#fdd835',1],['Noir','#151515',2],['Blanc','#ffffff',2],['Rose','#f48fb1',2],['Orange','#fb8c00',2],['Violet','#8e44ad',2],['Marron','#795548',2]],
numbers:[['Un',1,1],['Deux',2,1],['Trois',3,2],['Quatre',4,2],['Cinq',5,2],['Six',6,1],['Sept',7,2],['Huit',8,2],['Neuf',9,2],['Dix',10,1]],
alphabet:'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map((l,i)=>[l.toLowerCase(),l,i]),
shapes:[['Cercle','<circle cx="90" cy="62" r="47"/>',2],['Carré','<rect x="43" y="16" width="94" height="94"/>',2],['Triangle','<polygon points="90,9 30,115 150,115"/>',3],['Rectangle','<rect x="17" y="32" width="146" height="66"/>',3],['Ovale','<ellipse cx="90" cy="64" rx="73" ry="42"/>',2],['Étoile','<polygon points="90,7 106,46 149,46 116,73 128,116 90,92 52,116 64,73 31,46 74,46"/>',3],['Cœur','<path d="M90 114 C68 94 22 68 22 42 C22 8 69 4 90 37 C111 4 158 8 158 42 C158 68 112 94 90 114Z"/>',2],['Losange','<polygon points="90,8 155,65 90,122 25,65"/>',2],['Pentagone','<polygon points="90,8 154,56 130,116 50,116 26,56"/>',4],['Hexagone','<polygon points="55,12 125,12 161,64 125,116 55,116 19,64"/>',3]],
animals:[['Chat','🐈',1],['Chien','🐕',2],['Lion','🦁',2],['Éléphant','🐘',3],['Lapin','🐇',2],['Cheval','🐎',3],['Vache','🐄',2],['Mouton','🐑',3],['Poisson','🐟',3],['Oiseau','🐦',3]],
fruits:[['Pomme','🍎',2],['Banane','🍌',2],['Orange','🍊',3],['Fraise','🍓',3],['Raisin','🍇',3],['Poire','🍐',2],['Pastèque','🍉',3],['Citron','🍋',3],['Cerise','🍒',3],['Ananas','🍍',2]]
};
const SUBJECTS=['colors','numbers','alphabet','shapes','animals','fruits'];
const NAMES={colors:'Les Couleurs',numbers:'Les Nombres',alphabet:"L'Alphabet",shapes:'Les Formes',animals:'Les Animaux',fruits:'Les Fruits'};
const TYPES={choose:'Choisir',write:'Écrire',letter:'Compléter'};
const KEY='francais_exams_topics_v1_20261112';
const $=id=>document.getElementById(id);
let data,exam;
function norm(s){return String(s??'').normalize('NFC').trim().toLocaleLowerCase('fr-FR').replace(/\s+/g,' ');}
function random(a){const b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
function show(which){$('exam').classList.toggle('hidden',which!=='exam');$('result').classList.toggle('hidden',which!=='result');}
function init(){
 try{data=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){data=null;}
 if(!data||!data.subjects){data={name:'',subjects:{}};}
 if(!data.mixed||!Array.isArray(data.mixed.attempts))data.mixed={attempts:[],current:null};
 if(typeof data.name!=='string')data.name='';
 save();
 const m=data.mixed;
 if(m.current&&m.current.completed){showResult();}
 else if(m.current&&Array.isArray(m.current.questions)&&m.current.questions.length===18){showQuestion();}
 else if(m.attempts.length<3){start();}
 else showResult();
}
function start(){
 if(data.mixed.attempts.length>=3){showResult();return;}
 const questions=[];
 for(const subject of SUBJECTS){
   const bank=BANK[subject],picked=random(bank.map((_,i)=>i)).slice(0,3);
   ['choose','write','letter'].forEach((mode,k)=>{
     const index=picked[k],other=random(bank.map((_,i)=>i).filter(i=>i!==index)).slice(0,3);
     questions.push({subject,mode,index,choices:mode==='choose'?random([index,...other]):null});
   });
 }
 data.mixed.current={questions:random(questions),index:0,answers:[],selected:null,completed:false};save();showQuestion();
}
function current(){const c=data.mixed.current;return c.questions[c.index];}
function showQuestion(){
 const c=data.mixed.current;if(c.completed){showResult();return;}show('exam');
 const q=current(),item=BANK[q.subject][q.index];
 $('counter').textContent='Question '+(c.index+1)+' / 18';
 $('bar').style.width=(c.index*100/18)+'%';
 $('topic').textContent=NAMES[q.subject];$('mode').textContent=TYPES[q.mode];
 $('prompt').textContent=q.mode==='letter'?'Quelle lettre manque ?':q.subject==='colors'?'Quelle est cette couleur ?':q.subject==='numbers'?'Quel est ce nombre ?':q.subject==='alphabet'?'Quelle est cette lettre ?':'Quel est ce mot en français ?';
 for(const id of ['swatch','numeric','alpha','shape','emoji'])$(id).classList.toggle('hidden',true);
 if(q.subject==='colors'){$('swatch').style.backgroundColor=item[1];$('swatch').classList.toggle('hidden',false);}
 if(q.subject==='numbers'){$('numeric').textContent=item[1];$('numeric').classList.toggle('hidden',false);}
 if(q.subject==='alphabet'&&q.mode!=='letter'){$('alpha').textContent=item[1];$('alpha').classList.toggle('hidden',false);}
 if(q.subject==='shapes'){$('shape').innerHTML='<svg viewBox="0 0 180 128" xmlns="http://www.w3.org/2000/svg" fill="#75B9E8" stroke="#195B97" stroke-width="3">'+item[1]+'</svg>';$('shape').classList.toggle('hidden',false);}
 if(['animals','fruits'].includes(q.subject)){$('emoji').textContent=item[1];$('emoji').classList.toggle('hidden',false);}
 $('options').classList.toggle('hidden',q.mode!=='choose');$('writeGroup').classList.toggle('hidden',q.mode!=='write');$('letterGroup').classList.toggle('hidden',q.mode!=='letter');
 if(q.mode==='choose'){
  $('options').replaceChildren();
  for(const idx of q.choices){
    const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=BANK[q.subject][idx][0];b.setAttribute('aria-pressed',String(c.selected===idx));
    b.addEventListener('click',()=>{c.selected=idx;save();for(const el of $('options').children)el.setAttribute('aria-pressed',String(el===b));$('next').disabled=false;});
    $('options').appendChild(b);
  }
 }
 if(q.mode==='write'){
   $('writeInput').value=typeof c.selected==='string'?c.selected:'';
   $('writeLabel').textContent=q.subject==='numbers'?'Écris le nombre en lettres :':q.subject==='alphabet'?'Écris la lettre en minuscule :':'Écris le mot en français :';
 }
 if(q.mode==='letter'){
   if(q.subject==='alphabet'){let a='ABCDEFGHIJKLMNOPQRSTUVWXYZ',p=item[2];$('blank').textContent=p===0?'_ B C':p===25?'X Y _':a[p-1]+' _ '+a[p+1];}
   else $('blank').textContent=item[0].slice(0,item[2])+' _ '+item[0].slice(item[2]+1);
   $('letterInput').value=typeof c.selected==='string'?c.selected:'';
 }
 $('next').disabled=q.mode==='choose'?!Number.isInteger(c.selected):!String(c.selected??'').trim();
 $('next').textContent=c.index===17?'Terminer':'Suivant';
}
function accurate(q,answer){
 const item=BANK[q.subject][q.index];
 return q.mode==='choose'?answer===q.index:q.mode==='write'?norm(answer)===norm(item[0]):norm(answer)===norm(q.subject==='alphabet'?item[0]:item[0][item[2]]);
}
function advance(){
 const c=data.mixed.current;if(!c||c.completed)return;const q=current();
 if(q.mode==='choose'&&!Number.isInteger(c.selected))return;
 if(q.mode!=='choose'&&!String(c.selected??'').trim())return;
 c.answers.push(c.selected);c.index++;c.selected=null;
 if(c.index===18){
   const breakdown={};for(const s of SUBJECTS)breakdown[s]=0;
   let score=0;
   for(let i=0;i<18;i++)if(accurate(c.questions[i],c.answers[i])){score++;breakdown[c.questions[i].subject]++;}
   c.completed=true;c.completedAt=new Date().toISOString();c.score=score;c.breakdown=breakdown;
   data.mixed.attempts.push({score,breakdown,completedAt:c.completedAt});save();showResult();
 }else{save();showQuestion();}
}
function report(){
 const lines=['Résultats — Examen Général','Élève : '+data.name.trim(),'18 questions — 6 thèmes','Tentatives effectuées : '+data.mixed.attempts.length+'/3',''];
 data.mixed.attempts.forEach((a,i)=>{
   lines.push('Tentative '+(i+1)+' : '+a.score+'/18 ('+Math.round(a.score/18*100)+' %)');
   for(const s of SUBJECTS)lines.push('  '+NAMES[s]+' : '+(a.breakdown?.[s]??0)+'/3');
   lines.push('');
 });
 return lines.join('\n').trim();
}
function updateName(){const ready=!!data.name.trim();$('copy').disabled=!ready;$('share').disabled=!ready;}
function showResult(){
 show('result');const m=data.mixed;
 if(!m.attempts.length){$('score').textContent='0 / 18';return;}
 const a=m.attempts[m.attempts.length-1];
 $('score').textContent=a.score+' / 18';$('percentage').textContent=Math.round(a.score/18*100)+' %';
 $('attempt').textContent='Tentative '+m.attempts.length+' sur 3';
 $('dots').replaceChildren();
 for(let i=1;i<=3;i++){const d=document.createElement('span');d.className='dot'+(i<=m.attempts.length?' used':'');d.textContent=i;$('dots').appendChild(d);}
 const remaining=3-m.attempts.length;$('remaining').textContent=remaining===0?'3 tentatives utilisées — examen terminé':'Il vous reste '+remaining+(remaining===1?' tentative':' tentatives');
 $('history').textContent='Notes : '+m.attempts.map((a,i)=>(i+1)+'. '+a.score+'/18').join(' · ');
 $('retry').classList.toggle('hidden',remaining===0);
 $('breakdown').replaceChildren();
 for(const s of SUBJECTS){
  const line=document.createElement('div');line.className='row';
  const label=document.createElement('span');label.textContent=NAMES[s];
  const score=document.createElement('strong');score.textContent=(a.breakdown?.[s]??0)+'/3';
  line.appendChild(label);line.appendChild(score);$('breakdown').appendChild(line);
 }
 $('name').value=data.name||'';$('status').textContent='';updateName();
}
$('next').addEventListener('click',advance);
$('writeInput').addEventListener('input',e=>{const c=data.mixed.current;c.selected=e.target.value;save();$('next').disabled=!e.target.value.trim();});
$('letterInput').addEventListener('input',e=>{const c=data.mixed.current;c.selected=e.target.value;save();$('next').disabled=!e.target.value.trim();});
$('writeInput').addEventListener('keydown',e=>{if(e.key==='Enter')advance();});
$('letterInput').addEventListener('keydown',e=>{if(e.key==='Enter')advance();});
$('backExam').addEventListener('click',()=>{window.location.href='./library.html';});
$('backResult').addEventListener('click',()=>{window.location.href='./library.html';});
$('retry').addEventListener('click',()=>{if(data.mixed.attempts.length<3)start();});
$('name').addEventListener('input',e=>{data.name=e.target.value.trimStart();save();updateName();});
$('share').addEventListener('click',()=>{if(data.name.trim())window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(report()),'_blank','noopener,noreferrer');});
$('copy').addEventListener('click',async()=>{if(!data.name.trim())return;try{await navigator.clipboard.writeText(report());$('status').textContent='Notes copiées !';}catch(e){const ta=document.createElement('textarea');ta.value=report();document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();$('status').textContent=ok?'Notes copiées !':'Copie indisponible.';}});
init();
})();
</script></body></html>
