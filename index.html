<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071a2f" />
  <title>Aviation Matrix</title>
  <meta name="description" content="Aviation Talent Intelligence & Development System" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .hero.aviation-immersive{position:relative;min-height:640px;background:radial-gradient(circle at 82% 18%,rgba(73,183,245,.22),transparent 30%),linear-gradient(145deg,#041525 0%,#082640 56%,#0a3355 100%);overflow:hidden}
    .hero.aviation-immersive:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 84%)}
    .aviation-runway{position:absolute;left:0;right:0;bottom:0;height:92px;opacity:.62;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.3),transparent)}
    .aviation-runway:before{content:"";position:absolute;left:50%;bottom:0;width:2px;height:90px;background:repeating-linear-gradient(to bottom,#dff6ff 0 12px,transparent 12px 25px)}
    .runway-light{position:absolute;bottom:17px;width:6px;height:6px;border-radius:50%;background:#9fe1ff;box-shadow:0 0 14px #67c7f7}.runway-light:nth-child(1){left:10%}.runway-light:nth-child(2){left:30%}.runway-light:nth-child(3){left:50%}.runway-light:nth-child(4){left:70%}.runway-light:nth-child(5){left:90%}
    .aviation-route{position:absolute;top:92px;right:4%;width:38%;height:185px;opacity:.42;pointer-events:none}.aviation-route-line{position:absolute;inset:32px 15px 15px;border-top:1px dashed rgba(165,225,255,.85);border-radius:50%}.aviation-route-plane{position:absolute;top:15px;right:12%;font-size:24px;color:#b9eaff;animation:amPlane 5s ease-in-out infinite}
    .route-code{margin-top:14px;font-size:11px;letter-spacing:.14em;color:#8fd6ff;font-weight:800}.clearance-strip{margin-top:22px;display:inline-flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid rgba(255,255,255,.16);border-radius:12px;color:#cce8f7;font-size:10px;letter-spacing:.07em}.pulse-dot{width:8px;height:8px;border-radius:50%;background:#74e6b3;box-shadow:0 0 0 0 rgba(116,230,179,.6);animation:amPulse 2s infinite}
    .hero-card.boarding-pass{position:relative;overflow:hidden;background:rgba(255,255,255,.98)}.hero-card.boarding-pass:before{content:"";position:absolute;top:0;right:0;width:110px;height:110px;background:radial-gradient(circle at top right,rgba(73,183,245,.18),transparent 65%)}
    .boarding-head,.boarding-foot{display:flex;justify-content:space-between;gap:12px;align-items:center}.boarding-head{margin-bottom:12px}.boarding-label,.boarding-code,.modal-flight-kicker{font-size:10px;letter-spacing:.15em;font-weight:900;color:#6c7f91}.boarding-sub{color:#6b7785;line-height:1.55;font-size:13px;margin-top:-4px}
    .boarding-pass .mini-item{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;border:1px solid #e7eef4;background:#f8fbfd}.boarding-pass .mini-item b{color:#071a2f}.boarding-pass .mini-item em{font-style:normal;font-size:9px;letter-spacing:.1em;color:#2387bc;font-weight:900}.boarding-foot{border-top:1px dashed #ced9e2;margin-top:18px;padding-top:16px;font-size:10px;color:#7a8792}.boarding-foot strong{color:#071a2f;font-size:11px}
    .aviation-modal{border-top:5px solid #49b7f5}.flight-checkin-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:16px 0 4px}.flight-checkin-steps span{padding:8px 6px;border-radius:10px;background:#eef4f8;color:#8a98a4;text-align:center;font-size:9px;font-weight:900;letter-spacing:.05em}.flight-checkin-steps span:first-child{background:#e2f5ff;color:#0a6699}
    .flow-flight-strip{display:flex;align-items:center;gap:10px;margin:0 0 15px;padding:10px 12px;border:1px solid #dbeaf2;background:#f2faff;border-radius:14px;color:#0d628d;font-size:11px;font-weight:800;letter-spacing:.06em}
    @keyframes amPulse{0%{box-shadow:0 0 0 0 rgba(116,230,179,.55)}70%{box-shadow:0 0 0 8px rgba(116,230,179,0)}100%{box-shadow:0 0 0 0 rgba(116,230,179,0)}}
    @keyframes amPlane{0%,100%{transform:translate(0,0) rotate(-18deg)}50%{transform:translate(-18px,8px) rotate(-18deg)}}
    @media(max-width:820px){.hero.aviation-immersive{min-height:auto}.aviation-route{width:72%;right:-20%;top:82px}.flight-checkin-steps{grid-template-columns:1fr 1fr}.route-code{letter-spacing:.07em}.clearance-strip{font-size:9px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="app.js"></script>
  <script>
    (()=>{
      const copy={
        ar:{hero:'أهلًا بك على متن رحلتك في عالم الطيران',sub:'من أول قرار مهني لحد المسار اللي يناسبك، Aviation Matrix بيبني رحلتك خطوة بخطوة داخل عالم الطيران.',start:'ابدأ الـ Check-in',eyebrow:'WELCOME ABOARD · AVIATION MATRIX',route:'CHECK-IN → PRE-FLIGHT → FIT → FLIGHT PATH',card:'Aviation Candidate Check-in',cardSub:'ابدأ رحلتك المهنية كمرشح طيران، وليس مجرد متدرب.',modal:'Aviation Candidate Check-in',modalSub:'مش هنطلب منك CV — ملفك المهني هيتبني داخل Aviation Matrix من بياناتك ونتائجك الحقيقية.'},
        en:{hero:'Welcome Aboard Your Aviation Journey',sub:'From your first career decision to the aviation path that fits you, Aviation Matrix builds your journey step by step.',start:'Start Candidate Check-in',eyebrow:'WELCOME ABOARD · AVIATION MATRIX',route:'CHECK-IN → PRE-FLIGHT → FIT → FLIGHT PATH',card:'Aviation Candidate Check-in',cardSub:'Start as an aviation candidate, not just a course applicant.',modal:'Aviation Candidate Check-in',modalSub:'No CV upload — your professional profile will be built inside Aviation Matrix from your real data and results.'},
        fr:{hero:'Bienvenue à bord de votre parcours aviation',sub:'De votre première décision de carrière au parcours aviation qui vous correspond, Aviation Matrix construit votre trajectoire étape par étape.',start:'Commencer le check-in candidat',eyebrow:'BIENVENUE À BORD · AVIATION MATRIX',route:'CHECK-IN → PRÉ-VOL → FIT → TRAJECTOIRE',card:'Check-in du candidat aviation',cardSub:'Commencez comme candidat aviation, pas simplement comme stagiaire.',modal:'Check-in du candidat aviation',modalSub:'Pas de CV à téléverser — votre profil professionnel sera construit dans Aviation Matrix.'},
        ru:{hero:'Добро пожаловать на борт вашей авиационной карьеры',sub:'От первого карьерного решения до подходящего авиационного направления — Aviation Matrix строит ваш путь шаг за шагом.',start:'Начать check-in кандидата',eyebrow:'ДОБРО ПОЖАЛОВАТЬ НА БОРТ · AVIATION MATRIX',route:'CHECK-IN → PRE-FLIGHT → FIT → FLIGHT PATH',card:'Check-in авиационного кандидата',cardSub:'Начните как авиационный кандидат, а не просто слушатель курса.',modal:'Check-in авиационного кандидата',modalSub:'CV загружать не нужно — профессиональный профиль будет построен внутри Aviation Matrix.'}
      };
      const current=()=>copy[document.documentElement.lang]||copy.en;
      function enhanceLanding(){const hero=document.querySelector('.hero');if(!hero||hero.dataset.flightEnhanced)return;hero.dataset.flightEnhanced='1';hero.classList.add('aviation-immersive');const c=current(),h1=hero.querySelector('h1'),p=hero.querySelector('p'),eye=hero.querySelector('.eyebrow'),start=hero.querySelector('#startBtn'),card=hero.querySelector('.hero-card');if(h1)h1.textContent=c.hero;if(p)p.textContent=c.sub;if(eye)eye.textContent=c.eyebrow;if(start)start.innerHTML='✈&nbsp;&nbsp;'+c.start;if(h1){const route=document.createElement('div');route.className='route-code';route.textContent=c.route;h1.before(route)}const clear=document.createElement('div');clear.className='clearance-strip';clear.innerHTML='<span class="pulse-dot"></span><strong>STATUS</strong><span>READY FOR CANDIDATE CHECK-IN</span>';const ctas=hero.querySelector('.cta-row');if(ctas)ctas.after(clear);hero.insertAdjacentHTML('afterbegin','<div class="aviation-runway"><span class="runway-light"></span><span class="runway-light"></span><span class="runway-light"></span><span class="runway-light"></span><span class="runway-light"></span></div><div class="aviation-route"><div class="aviation-route-line"></div><div class="aviation-route-plane">✈</div></div>');if(card){card.classList.add('boarding-pass');const title=card.querySelector('h3');if(title)title.textContent=c.card;card.insertAdjacentHTML('afterbegin','<div class="boarding-head"><span class="boarding-label">BOARDING PASS</span><span class="boarding-code">AMX · 001</span></div>');if(title)title.insertAdjacentHTML('afterend','<p class="boarding-sub">'+c.cardSub+'</p>');const items=[['01','Candidate Check-in','OPEN'],['02','Pre-Flight Assessment','NEXT'],['03','Current / Future Fit','FIT'],['04','Suggested Aviation Path','PATH'],['05','My Flight Path','READY']];card.querySelectorAll('.mini-item').forEach((el,i)=>{const x=items[i];if(x)el.innerHTML='<b>'+x[0]+'</b><span>'+x[1]+'</span><em>'+x[2]+'</em>'});card.insertAdjacentHTML('beforeend','<div class="boarding-foot"><span>GATE</span><strong>AM</strong><span>DESTINATION</span><strong>YOUR AVIATION FUTURE</strong></div>')}}
      function enhanceModal(){const modal=document.querySelector('.modal');if(!modal||modal.dataset.flightEnhanced)return;modal.dataset.flightEnhanced='1';modal.classList.add('aviation-modal');const c=current(),h2=modal.querySelector('h2'),muted=modal.querySelector('.modal-head .muted');if(h2)h2.textContent=c.modal;if(muted)muted.textContent=c.modalSub;const head=modal.querySelector('.modal-head');if(head)head.insertAdjacentHTML('beforebegin','<div class="modal-flight-kicker">CANDIDATE CHECK-IN · GATE AM</div><div class="flight-checkin-steps"><span>1 · CHECK-IN</span><span>2 · PRE-FLIGHT</span><span>3 · FIT</span><span>4 · FLIGHT PATH</span></div>')}
      function enhanceFlow(){const flow=document.querySelector('main.flow');if(!flow||flow.dataset.flightEnhanced)return;flow.dataset.flightEnhanced='1';flow.insertAdjacentHTML('afterbegin','<div class="flow-flight-strip">✈ &nbsp; AVIATION JOURNEY CONTROL &nbsp; · &nbsp; CHECK-IN → PRE-FLIGHT → FIT → FLIGHT PATH</div>')}
      function apply(){enhanceLanding();enhanceModal();enhanceFlow()}
      window.addEventListener('load',()=>{apply();new MutationObserver(()=>apply()).observe(document.getElementById('app').parentNode,{childList:true,subtree:true})});
    })();
  </script>
</body>
</html>
