name: Phase 06 Reviewer Build

on:
  pull_request:
    paths:
      - 'apps/phase06-reviewer/**'
      - '.github/workflows/phase06-reviewer-build.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/phase06-reviewer/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/phase06-reviewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/phase06-reviewer/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
