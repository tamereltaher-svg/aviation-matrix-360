name: Secure resume patch

on:
  push:
    paths:
      - '.github/workflows/secure-resume-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch applicant resume flow
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d | python
      - name: Verify patch
        run: |
          grep -q "resumeApplicationWithToken" app.js
          grep -q "state.resume_token" app.js
      - name: Commit hardened frontend and remove temporary workflow
        run: |
          git config user.name "aviation-matrix-security-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/secure-resume-patch.yml
          git add app.js
          git commit -m "Harden applicant resume token flow"
          git push
