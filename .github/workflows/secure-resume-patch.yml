name: Secure resume patch

on:
  push:
    paths:
      - '.github/workflows/secure-resume-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch applicant resume flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          marker="function showOtpStep(){"
          insert=r'''async function resumeApplicationWithToken(appNo,token){
 const data=await callApplicationLogin({action:'resume_token',application_number:appNo,resume_token:token});
 const applicationData=data.application||{};
 state={...state,...applicationData,resume_token:data.resume_token,resume_token_expires_at:data.resume_token_expires_at};
 if(applicationData.assessment_result){
  const er=applicationData.assessment_result.evidence_payload||{};
  state.assessment={
   current_fit:applicationData.assessment_result.current_fit,
   future_fit:applicationData.assessment_result.future_fit,
   readiness_status:applicationData.assessment_result.readiness_status,
   summary:applicationData.assessment_result.summary,
   ...er
  };
 }
 save();
 const resumeData=data.assessment||{};
 document.getElementById('resumeOverlay')?.remove();
 if(resumeData.status==='in_progress'){
  await loadPublishedQuestions();
  assessment={
   index:Math.min(Number(resumeData.answered_count)||0,Math.max(runtimeQuestions.length-1,0)),
   attempt_id:resumeData.attempt_id,
   access_token:resumeData.access_token,
   candidate_id:resumeData.candidate_id,
   locked:false,
   result:null
  };
  render('assessment');
 }else if(resumeData.status==='completed' && state.assessment){
  render('results');
 }else if(applicationData.assessment_result){
  render('results');
 }else if(applicationData.profile_status){
  render('confirm');
 }else{
  render('welcome');
 }
}

'''
          if 'async function resumeApplicationWithToken(' not in s:
              if marker not in s: raise SystemExit('showOtpStep marker missing')
              s=s.replace(marker,insert+marker,1)
          old=""" if(msg){msg.className='helper';msg.textContent=c.finding;}\n try{\n  const data=await callApplicationLogin({action:'send',application_number:appNo});"""
          new=""" if(msg){msg.className='helper';msg.textContent=c.finding;}\n try{\n  if(state.application_number===appNo && state.resume_token){\n   try{\n    await resumeApplicationWithToken(appNo,state.resume_token);\n    return;\n   }catch(tokenError){\n    if(tokenError.code==='INVALID_OR_EXPIRED_RESUME_TOKEN'){\n     delete state.resume_token;\n     delete state.resume_token_expires_at;\n     save();\n    }else{\n     throw tokenError;\n    }\n   }\n  }\n  const data=await callApplicationLogin({action:'send',application_number:appNo});"""
          if old not in s: raise SystemExit('requestApplicationOtp marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          grep -q "resumeApplicationWithToken" app.js
          grep -q "resume_token" app.js
      - name: Commit hardened frontend and remove temporary workflow
        run: |
          git config user.name "aviation-matrix-security-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/secure-resume-patch.yml
          git add app.js
          git commit -m "Harden applicant resume token flow"
          git push
