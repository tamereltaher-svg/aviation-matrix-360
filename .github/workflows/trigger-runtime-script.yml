name: Trigger runtime script
on:
  push:
    paths:
      - '.github/workflows/trigger-runtime-script.yml'
permissions:
  contents: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch runtime probe script
        run: |
          printf '\n// runtime gate trigger\n' >> scripts/runtime-application-gate.cjs
          git config user.name "aviation-matrix-security-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/runtime-application-gate.cjs
          git commit -m "Trigger live application runtime gate"
          git push