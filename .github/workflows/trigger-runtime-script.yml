name: Trigger runtime script
on:
  push:
    paths:
      - '.github/workflows/trigger-runtime-script.yml'
permissions:
  contents: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and trigger runtime probe
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/runtime-application-gate.cjs')
          s=p.read_text()
          s=s.replace("aviation_interest:'operations'","aviation_interest:'ground_operations'")
          p.write_text(s+'\n// runtime gate trigger 2\n')
          PY
          git config user.name "aviation-matrix-security-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/runtime-application-gate.cjs
          git commit -m "Fix runtime gate fixture and trigger"
          git push