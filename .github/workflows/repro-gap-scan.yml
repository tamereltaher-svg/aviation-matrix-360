name: Temporary Repro Gap Scan
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repro-gap-scan.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json, pathlib, re
          rows=json.loads(pathlib.Path('supabase/reproducibility/replay-manifest.json').read_text())['migrations'][67:]
          refs={'assessment':set(),'assessment_staging':set()}; creates={'assessment':set(),'assessment_staging':set()}
          for x in rows:
              t=pathlib.Path(x['path']).read_text()
              for s in refs:
                  refs[s].update(n.lower() for n in re.findall(r'\b'+s+r'\.([a-zA-Z_][a-zA-Z0-9_]*)',t))
                  creates[s].update(n.lower() for n in re.findall(r'(?is)\bcreate\s+(?:or\s+replace\s+)?(?:table|view|materialized\s+view|function)\s+(?:if\s+not\s+exists\s+)?'+s+r'\.([a-zA-Z_][a-zA-Z0-9_]*)',t))
          for s in refs:
              print('SCHEMA='+s)
              print('PREEXISTING_REFERENCES='+','.join(sorted(refs[s]-creates[s])))
              print('COUNT='+str(len(refs[s]-creates[s])))
          PY
