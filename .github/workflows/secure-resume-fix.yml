name: Secure resume syntax fix

on:
  push:
    paths:
      - '.github/workflows/secure-resume-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix bracket and validate JavaScript
        env:
          FIX_B64: 
        run: |
          echo "$FIX_B64" | base64 -d | python
          node --check app.js
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "aviation-matrix-security-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/secure-resume-fix.yml
          git add app.js
          git commit -m "Fix secure applicant resume syntax"
          git push
