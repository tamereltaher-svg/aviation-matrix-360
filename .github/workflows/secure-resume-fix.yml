name: Secure resume syntax fix

on:
  push:
    paths:
      - '.github/workflows/secure-resume-fix.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check app.js
      - name: Remove temporary workflow
        run: |
          git config user.name "aviation-matrix-security-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/secure-resume-fix.yml
          git commit -m "Remove temporary secure resume validator"
          git push
