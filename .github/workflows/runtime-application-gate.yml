name: Runtime application gate
on:
  push:
    paths:
      - '.github/workflows/runtime-application-gate.yml'
      - 'scripts/runtime-application-gate.cjs'
      - 'runtime-gate-trigger.txt'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run live Edge HTTP gate
        run: node scripts/runtime-application-gate.cjs