name: Deploy Phase 06 Review API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/phase06-review-api/**'
      - '.github/workflows/phase06-supabase-edge-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: vsuekfzyebqnhthyvwpf
    steps:
      - uses: actions/checkout@v4

      - name: Require Supabase deployment credential
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN repository secret is not configured."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy phase06-review-api
        run: supabase functions deploy phase06-review-api --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Verify API rejects anonymous access
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/phase06-review-api.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"action":"progress"}' \
            "https://${PROJECT_REF}.supabase.co/functions/v1/phase06-review-api")
          cat /tmp/phase06-review-api.json
          test "$code" = "401"
