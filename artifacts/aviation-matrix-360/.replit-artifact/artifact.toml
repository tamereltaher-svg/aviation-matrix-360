kind = "web"
previewPath = "/"
title = "Aviation Matrix 360"
version = "1.0.0"
id = "artifacts/aviation-matrix-360"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25406

[services.development]
run = "pnpm --filter @workspace/aviation-matrix-360 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aviation-matrix-360", "run", "build" ]
publicDir = "artifacts/aviation-matrix-360/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25406"
BASE_PATH = "/"
