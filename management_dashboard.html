<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Management Overview</title><link rel="stylesheet" href="phase8.css"></head>
<body><div class="wrap"><div class="top"><a class="back" href="portal.html">← Back</a><div class="brand">AVIATION MATRIX<small>FINAL INTEGRATION • PHASE 8</small></div></div>
<section class="hero"><h1>Management Overview</h1><p>Executive-level operating indicators drawn from the same candidate, learning, recruitment and workflow engines.</p></section><div id="err" class="error"></div>
<div class="toolbar"><button class="btn primary" onclick="load()">Refresh</button></div><div id="kpis" class="kpis"></div>
<section class="section"><h2>Operating Overview</h2><div class="grid">
<div class="card"><h3>Talent</h3><p id="talent"></p></div><div class="card"><h3>Learning</h3><p id="learning"></p></div><div class="card"><h3>Recruitment</h3><p id="recruit"></p></div><div class="card"><h3>Governance</h3><p id="gov"></p></div>
</div></section>
<footer>Aviation Matrix • Phase 8 Final Integration</footer></div>
<script src="phase8.js"></script><script>
async function load(){try{const j=await api('management_overview'),x=j.overview||{};document.getElementById('kpis').innerHTML=`<div class="kpi"><b>${num(x.candidates)}</b><small>CANDIDATES</small></div><div class="kpi"><b>${num(x.active_learners)}</b><small>ACTIVE LEARNERS</small></div><div class="kpi"><b>${num(x.final_exam_results)}</b><small>FINAL EXAMS</small></div><div class="kpi"><b>${num(x.active_employers)}</b><small>ACTIVE EMPLOYERS</small></div><div class="kpi"><b>${num(x.hired_candidates)}</b><small>HIRED</small></div>`;document.getElementById('talent').innerHTML=`Candidates: <b>${num(x.candidates)}</b><br>Active learners: <b>${num(x.active_learners)}</b><br>Positive matches: <b>${num(x.positive_matches)}</b>`;document.getElementById('learning').innerHTML=`Final exam results: <b>${num(x.final_exam_results)}</b><br>Active credentials: <b>${num(x.active_credentials)}</b>`;document.getElementById('recruit').innerHTML=`Active employers: <b>${num(x.active_employers)}</b><br>Active campaigns: <b>${num(x.active_campaigns)}</b><br>Hired candidates: <b>${num(x.hired_candidates)}</b>`;document.getElementById('gov').innerHTML=`Open workflow tasks: <b>${num(x.open_workflow_tasks)}</b><br>Pending approvals: <b>${num(x.pending_approvals)}</b>`}catch(e){err(e)}}load();
</script></body></html>
