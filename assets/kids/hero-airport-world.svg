 <rect width="330" height="120" rx="24" fill="#12345a"/>
 <text x="34" y="50" fill="#fff" font-family="Arial" font-size="30" font-weight="700">KIDS AVIATION WORLD</text>
 <text x="34" y="88" fill="#bfeeff" font-family="Arial" font-size="20">DISCOVER • LEARN • EXPLORE • FLY</text>
</g>
