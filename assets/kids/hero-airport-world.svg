<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8edcff"/><stop offset=".58" stop-color="#dff7ff"/><stop offset="1" stop-color="#fff7d7"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c9efff" stop-opacity=".9"/><stop offset="1" stop-color="#7fcbe9" stop-opacity=".7"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#edf7fb"/><stop offset="1" stop-color="#cbdbe4"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<g fill="#fff" opacity=".88">
 <ellipse cx="220" cy="160" rx="180" ry="52"/><ellipse cx="360" cy="180" rx="150" ry="45"/>
 <ellipse cx="1290" cy="145" rx="170" ry="48"/><ellipse cx="1420" cy="165" rx="145" ry="42"/>
</g>
<!-- terminal glass -->
<path d="M0 470 H1600 V900 H0Z" fill="url(#floor)"/>
<g stroke="#7daec5" stroke-width="10">
 <rect x="120" y="295" width="1360" height="320" rx="28" fill="url(#glass)"/>
 <path d="M390 295V615M660 295V615M930 295V615M1200 295V615"/>
</g>
