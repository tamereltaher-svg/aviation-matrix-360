const sheets=[...document.querySelectorAll(".sheet")];
let current=MAPS[0].id;
function show(id){current=MAPS.some(x=>x.id===id)?id:MAPS[0].id;select.value=current;sheets.forEach(s=>s.hidden=s.dataset.id!==current);try{history.replaceState(null,"","#"+current)}catch(e){}}

function move(delta){const i=MAPS.findIndex(x=>x.id===current),next=(i+delta+MAPS.length)%MAPS.length;show(MAPS[next].id)}
document.getElementById("prev").addEventListener("click",()=>move(-1));document.getElementById("next").addEventListener("click",()=>move(1));
document.getElementById("single").addEventListener("click",()=>{sheets.forEach(s=>s.hidden=s.dataset.id!==current);window.print()});
document.getElementById("all").addEventListener("click",()=>{sheets.forEach(s=>s.hidden=false);window.print();setTimeout(()=>show(current),500)});
