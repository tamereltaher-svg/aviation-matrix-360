<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aviation Matrix — Set Admin Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4f8fb;color:#10263a}
.wrap{max-width:520px;margin:70px auto;padding:20px}
.card{background:#fff;border:1px solid #dfe8ef;border-radius:22px;padding:22px;box-shadow:0 18px 50px rgba(6,25,43,.08)}
h2{margin-top:0}label{display:block;font-size:11px;font-weight:900;color:#486176;margin:12px 0 6px}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cfdae4;border-radius:12px;font:inherit}
button{margin-top:14px;border:0;border-radius:12px;padding:12px 15px;background:#06192b;color:#fff;font-weight:900;cursor:pointer}
.notice{margin:12px 0;padding:12px 14px;border-radius:12px;background:#e9f8f3;color:#0b6a54;font-weight:800}
.error{background:#fff0ef;color:#a02b21}
.hidden{display:none}
small{color:#6a7d8f;line-height:1.6}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h2>Set Store Admin Password</h2>
<small>This page is for one-time setup only. After the password is saved successfully, delete this file from GitHub.</small>
<div id="msg"></div>

<label>ADMIN EMAIL</label>
<input id="email" value="tamereltaher@exit-logistics.com" readonly>
<button onclick="sendCode()">Send One-Time Verification Code</button>

<div id="verifyBox" class="hidden">
<label>VERIFICATION CODE</label>
<input id="code" inputmode="numeric" placeholder="6-digit code">
<button onclick="verifyCode()">Verify</button>
</div>

<div id="passwordBox" class="hidden">
<label>NEW PASSWORD</label>
<input id="password" type="password" placeholder="Enter the new admin password">
<label>CONFIRM PASSWORD</label>
<input id="confirm" type="password" placeholder="Repeat the new password">
<button onclick="savePassword()">Save Admin Password</button>
</div>
</div></div>

<script>
const sb=window.supabase.createClient('https://vsuekfzyebqnhthyvwpf.supabase.co','sb_publishable_sRvoFKXyDEzQPLaAk3xZOQ_RLVxh5g3');
function message(t,e=false){document.getElementById('msg').innerHTML=`<div class="notice ${e?'error':''}">${t}</div>`}

async function sendCode(){
 const email=document.getElementById('email').value;
 const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});
 if(error)return message(error.message,true);
 document.getElementById('verifyBox').classList.remove('hidden');
 message('Verification code sent. Use it once to confirm the admin account.');
}

async function verifyCode(){
 const email=document.getElementById('email').value;
 const token=document.getElementById('code').value.trim();
 const {data,error}=await sb.auth.verifyOtp({email,token,type:'email'});
 if(error)return message(error.message,true);
 document.getElementById('passwordBox').classList.remove('hidden');
 message('Account verified. Set the admin password now.');
}

async function savePassword(){
 const p=document.getElementById('password').value;
 const c=document.getElementById('confirm').value;
 if(p.length<8)return message('Password must be at least 8 characters.',true);
 if(p!==c)return message('Passwords do not match.',true);
 const {data,error}=await sb.auth.updateUser({password:p});
 if(error)return message(error.message,true);
 message('Admin password saved successfully. You can now use store_admin.html with password-only login.');
 await sb.auth.signOut();
}
</script>
</body>
</html>
